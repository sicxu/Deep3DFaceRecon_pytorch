name: deep3d_modern

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - numpy=2.4.6
  - scipy=1.17.1
  - pillow=12.3.0
  - tensorboard=2.20.0

  - pip:
      # PyTorch CUDA 13.0 wheels
      - --extra-index-url=https://download.pytorch.org/whl/cu130

      - torch==2.12.1+cu130
      - torchvision==0.27.1+cu130

      # Deep3DFace dependencies
      - opencv-python==5.0.0.93
      - scikit-image==0.26.0
      - matplotlib==3.11.1
      - kornia==0.8.3
      - trimesh==5.0.0
      - dominate==2.9.1

      # Native extension build helper
      - ninja==1.13.0
